<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Studio | Official Clock Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050302;
            font-family: 'Georgia', serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        /* Background image layer */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/sfondo_main.jpg') center center / contain no-repeat;
            z-index: 1;
        }
        .glow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 45%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
        }
        /* Particle & Sparkle Canvas */
        #effects-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        
        /* Clock Overlay Wrapper */
        .clock-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (990 / 1100));
            max-height: calc(100vw * (1100 / 990));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4;
            pointer-events: none;
        }

        /* Perfectly Centered Pivot point for the Clock Hands inside the G Logo frame */
        .clock-overlay {
            position: absolute;
            top: 45.2%;
            left: 50.0%;
            transform: translate(-50%, -50%);
            width: 72%;
            height: 65%;
            pointer-events: none;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
        }

        /* Sharp 3D Solid Metallic Gold Hour Hand (NO GLOW) */
        .hour-hand {
            width: 16px;
            height: 35%;
            margin-left: -8px;
            background: linear-gradient(90deg, 
                #4a330b 0%, 
                #8a641c 15%, 
                #d4af37 45%, 
                #fff8d6 50%, 
                #e5c158 55%, 
                #9e7523 85%, 
                #3b2807 100%);
            box-shadow: -6px 8px 12px rgba(0, 0, 0, 0.95), inset 1px 0 2px rgba(255, 255, 255, 0.6);
            border-left: 1px solid #ffe894;
            border-right: 1px solid #5a3d0c;
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
            z-index: 10;
        }

        /* Sharp 3D Solid Metallic Gold Minute Hand (NO GLOW) */
        .minute-hand {
            width: 10px;
            height: 49%;
            margin-left: -5px;
            background: linear-gradient(90deg, 
                #543a0e 0%, 
                #997022 20%, 
                #ffd700 48%, 
                #ffffff 50%, 
                #d4af37 52%, 
                #8a641c 80%, 
                #3d2908 100%);
            box-shadow: -5px 7px 14px rgba(0, 0, 0, 0.95), inset 1px 0 2px rgba(255, 255, 255, 0.7);
            border-left: 1px solid #fff2b3;
            border-right: 1px solid #4a330b;
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            z-index: 11;
        }

        /* Sharp 3D Solid Metallic Gold Second Hand (NO GLOW) */
        .second-hand {
            width: 3.5px;
            height: 53%;
            margin-left: -1.75px;
            background: linear-gradient(90deg, #6e4e13 0%, #ffd700 50%, #fff8d6 70%, #8a641c 100%);
            box-shadow: -3px 5px 8px rgba(0, 0, 0, 0.9);
            z-index: 12;
        }

        /* Solid Gold Center Cap with 3D Bevel Edge */
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34px;
            height: 34px;
            background: conic-gradient(from 0deg at 50% 50%, 
                #ffd700 0deg, 
                #8a641c 90deg, 
                #fff8d6 180deg, 
                #6e4e13 270deg, 
                #ffd700 360deg);
            border-radius: 50%;
            z-index: 15;
            box-shadow: -3px 6px 12px rgba(0, 0, 0, 0.95), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            border: 2px solid #fff2b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-layer"></div>
        <div class="glow-overlay"></div>
        <canvas id="effects-canvas"></canvas>

        <div class="clock-container">
            <div class="clock-overlay">
                <div class="hand hour-hand" id="hour"></div>
                <div class="hand minute-hand" id="minute"></div>
                <div class="hand second-hand" id="second"></div>
                <div class="center-cap"></div>
            </div>
        </div>
    </div>

    <script>
        // Real-Time Clock Engine
        function updateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const seconds = now.getSeconds() + ms / 1000;
            const minutes = now.getMinutes() + seconds / 60;
            const hours = (now.getHours() % 12) + minutes / 60;

            document.getElementById('second').style.transform = `rotate(${seconds * 6}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minutes * 6}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hours * 30}deg)`;

            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        // Canvas Setup
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Uniform Micro-Particle System
        const particles = [];
        const numParticles = 200;

        class MicroParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + Math.random() * 20;
                this.radius = 1.3;
                this.baseAlpha = Math.random() * 0.5 + 0.2;
                this.alpha = this.baseAlpha;
                this.speedY = -(Math.random() * 0.35 + 0.1);
                this.oscillation = Math.random() * Math.PI * 2;
                this.oscillationSpeed = Math.random() * 0.02 + 0.008;
                this.oscillationAmplitude = Math.random() * 0.4 + 0.1;
                
                const goldColors = [
                    'rgba(255, 235, 150, ',
                    'rgba(255, 215, 0, ',
                    'rgba(255, 245, 200, ',
                    'rgba(238, 190, 60, '
                ];
                this.colorBase = goldColors[Math.floor(Math.random() * goldColors.length)];
            }

            update() {
                this.y += this.speedY;
                this.oscillation += this.oscillationSpeed;
                this.x += Math.sin(this.oscillation) * this.oscillationAmplitude;

                this.alpha = this.baseAlpha + Math.sin(this.oscillation * 2) * 0.2;

                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                const currAlpha = Math.min(1, Math.max(0, this.alpha));
                ctx.fillStyle = `${this.colorBase}${currAlpha})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#ffd700';
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new MicroParticle());
        }

        // Delicate Sparkle Flares
        const sparkles = [];
        const numSparkles = 22;

        for (let i = 0; i < numSparkles; i++) {
            sparkles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 5 + 3,
                alpha: 0,
                maxAlpha: Math.random() * 0.7 + 0.25,
                fadeSpeed: Math.random() * 0.012 + 0.005,
                state: 'in'
            });
        }

        function drawSparkle(x, y, size, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = `rgba(255, 252, 220, ${alpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffd700';

            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            sparkles.forEach(s => {
                if (s.state === 'in') {
                    s.alpha += s.fadeSpeed;
                    if (s.alpha >= s.maxAlpha) s.state = 'out';
                } else {
                    s.alpha -= s.fadeSpeed;
                    if (s.alpha <= 0) {
                        s.alpha = 0;
                        s.x = Math.random() * canvas.width;
                        s.y = Math.random() * canvas.height;
                        s.maxAlpha = Math.random() * 0.7 + 0.25;
                        s.state = 'in';
                    }
                }

                if (s.alpha > 0) {
                    drawSparkle(s.x, s.y, s.size, s.alpha);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
